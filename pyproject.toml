[project]
name = "umt-pythonweb-hw-08"
version = "0.1.0"
description = "REST API for managing personal contacts (FastAPI + SQLAlchemy + Postgres)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic[email]>=2",
    "pydantic-settings>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx",
    "ruff",
    "pre-commit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]
